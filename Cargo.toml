[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Internal crates are listed here so members write `reno-proto.workspace = true`.
# External dependencies are added here as tasks introduce them (see docs/INVARIANTS.md ARCH-17).
[workspace.dependencies]
reno-proto = { path = "crates/reno-proto" }
reno-store = { path = "crates/reno-store" }
reno-harness = { path = "crates/reno-harness" }
reno-kernel = { path = "crates/reno-kernel" }
reno-rpc = { path = "crates/reno-rpc" }
reno-client = { path = "crates/reno-client" }
reno-markdown = { path = "crates/reno-markdown" }
reno-syntax = { path = "crates/reno-syntax" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
insta = { version = "1", features = ["json"] }
# Each member names the tokio features it needs.
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "json", "fmt", "ansi", "registry", "std"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rustix = { version = "1", features = ["process"] }
tempfile = "3"
proptest = "1"
unicode-segmentation = "1"

# Definitions (T1.4): TOML files, globs, time zones, and the file watcher (renod only).
toml = "1"
globset = { version = "0.4", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# SQLite: 0.41 because rusqlite_migration 2.7 requires rusqlite ^0.41 (links = "sqlite3").
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"

# GPUI: upstream Zed, pinned by git rev. The rev is `main` as of 2026-11-15.
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }

# Allocator (T0.11). The v2 line, as ARCHITECTURE 17.8 names it; optional in renod and reno-app.
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }

# Harness layer (imported).
async-trait = "0.1"
base64 = "0.22"
bzip2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
deser-hjson = "2.2"
filetime = "0.2"
flate2 = "1"
libc = "0.2"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
semver = "1"
sha2 = "0.10"
tar = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Imported markdown and syntax crates (T0.14). Tree-sitter pins are exact, as upstream tested them.
tree-sitter = "=0.26.11"
tree-sitter-highlight = "=0.26.11"
tree-sitter-rust = "=0.24.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-bash = "=0.25.1"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-md = "=0.5.3"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-java = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-swift = "=0.7.3"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.24.2"
tree-sitter-sequel = "=0.3.11"
tree-sitter-lua = "=0.5.0"
tree-sitter-luau = "=1.2.0"
tree-sitter-nix = "=0.3.0"
tree-sitter-make = "=1.1.1"
tree-sitter-containerfile = "=0.9.2"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 0

[profile.release]
lto = "thin"
strip = "symbols"
