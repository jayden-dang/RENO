[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Internal crates are listed here so members write `reno-proto.workspace = true`.
# External dependencies are added here as tasks introduce them (see docs/INVARIANTS.md ARCH-17).
[workspace.dependencies]
reno-proto = { path = "crates/reno-proto" }
reno-store = { path = "crates/reno-store" }
reno-harness = { path = "crates/reno-harness" }
reno-kernel = { path = "crates/reno-kernel" }
reno-rpc = { path = "crates/reno-rpc" }
reno-client = { path = "crates/reno-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
insta = { version = "1", features = ["json"] }
# Each member names the tokio features it needs.
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"
tracing = "0.1"
rustix = { version = "1", features = ["process"] }
tempfile = "3"
proptest = "1"

# SQLite: 0.41 because rusqlite_migration 2.7 requires rusqlite ^0.41 (links = "sqlite3").
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"

# GPUI: upstream Zed, pinned by git rev. The rev is `main` as of 2026-11-15.
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }

# Harness layer (imported).
async-trait = "0.1"
base64 = "0.22"
bzip2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
deser-hjson = "2.2"
filetime = "0.2"
flate2 = "1"
libc = "0.2"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
semver = "1"
sha2 = "0.10"
tar = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 0

[profile.release]
lto = "thin"
strip = "symbols"
