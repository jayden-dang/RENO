[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Internal crates are listed here so members write `reno-proto.workspace = true`.
# External dependencies are added here as tasks introduce them (see docs/INVARIANTS.md ARCH-17).
[workspace.dependencies]
reno-proto = { path = "crates/reno-proto" }
reno-store = { path = "crates/reno-store" }
reno-harness = { path = "crates/reno-harness" }
reno-kernel = { path = "crates/reno-kernel" }
reno-rpc = { path = "crates/reno-rpc" }
reno-client = { path = "crates/reno-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# GPUI: upstream Zed, pinned by git rev. The rev is `main` as of 2026-11-15.
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 0

[profile.release]
lto = "thin"
strip = "symbols"
