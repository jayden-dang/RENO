[package]
name = "reno"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Reno command line."

[[bin]]
name = "reno"
path = "src/main.rs"

[dependencies]
reno-proto.workspace = true
reno-client.workspace = true
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
notify.workspace = true
rmcp.workspace = true
rustix = { workspace = true, features = ["process", "termios"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "signal"] }
toml.workspace = true

[dev-dependencies]
reno-client = { workspace = true, features = ["fake"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "rt", "macros", "time"] }

[lints]
workspace = true
