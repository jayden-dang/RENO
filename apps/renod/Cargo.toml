[package]
name = "renod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Reno daemon."

[lib]
name = "renod"
path = "src/lib.rs"

[[bin]]
name = "renod"
path = "src/main.rs"

[features]
# The allocator is chosen by measurement (`cargo xtask bench --compare-allocators`); see ARCHITECTURE 17.8.
default = []
mimalloc = ["dep:mimalloc"]

[dependencies]
reno-proto.workspace = true
reno-store.workspace = true
reno-harness.workspace = true
reno-kernel.workspace = true
reno-rpc.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
futures.workspace = true
globset.workspace = true
mimalloc = { workspace = true, optional = true }
notify.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "process"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reno-client.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
