[package]
name = "reno-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
mimalloc = ["dep:mimalloc"]

[dependencies]
reno-proto.workspace = true
reno-markdown.workspace = true
reno-syntax.workspace = true
reno-notify.workspace = true
reno-term.workspace = true
reno-client = { workspace = true, features = ["fake"] }
chrono.workspace = true
futures.workspace = true
mimalloc = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
unicase.workspace = true
unicode-segmentation.workspace = true
regex.workspace = true
base64.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-types.workspace = true
ratex-svg.workspace = true
merman.workspace = true
usvg.workspace = true
resvg.workspace = true
tiny-skia.workspace = true
ttf-parser.workspace = true
gpui.workspace = true
# `runtime_shaders`: this Mac has Xcode but no Metal Toolchain component, so the build-time
# `metal` compile fails. Shaders are compiled at launch instead. See decision 0001.
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
gpui_tokio.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
