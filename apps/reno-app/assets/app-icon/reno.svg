<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Reno app icon. macOS icon grid: an 824 px rounded square centred on the 1024 canvas.
       Flat ink plate, paper mark: the Klynt mark's palette and construction (solid pieces, edges at
       0/45/90 degrees, one even gutter). The mark is assets/icons/mark.svg scaled to 430 px. -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#1d1c1a"/>
  <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <g fill="#ecebe6">
    <!-- stem, upper triangle -->
    <polygon points="298.2 297.0 398.6 397.3 298.2 497.7"/>
    <!-- bowl -->
    <polygon points="338.8 297.0 525.1 297.0 625.4 397.3 525.1 497.7 338.8 497.7 439.1 397.3"/>
    <!-- stem, lower triangle -->
    <polygon points="298.2 526.3 398.6 626.7 298.2 727.0"/>
    <!-- leg -->
    <polygon points="338.8 526.3 525.1 526.3 725.8 727.0 539.4 727.0"/>
  </g>
</svg>
