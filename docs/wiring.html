<script>
(function () {
  var data = JSON.parse(document.getElementById("wiring").textContent);
  var NS = "http://www.w3.org/2000/svg";
  var board = document.getElementById("board");
  var featureAt = {};
  var fileAt = {};
  var knotByN = {};
  data.knots.forEach(function (knot) { knotByN[knot.n] = knot; });

  var featX = 16, featY = 56, featW = 210, featH = 68, featGap = 8;
  data.features.forEach(function (name, index) {
    var y = featY + index * (featH + featGap);
    var fo = document.createElementNS(NS, "foreignObject");
    fo.setAttribute("x", featX);
    fo.setAttribute("y", y);
    fo.setAttribute("width", featW);
    fo.setAttribute("height", featH);
    var div = document.createElement("div");
    div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    div.className = "feat";
    div.textContent = name;
    fo.appendChild(div);
    document.getElementById("features").appendChild(fo);
    featureAt[name] = { x: featX + featW, y: y + featH / 2 };
  });

  var cols = 28;
  var rows = Math.ceil(data.files.length / cols);
  var gridX = 244, gridY = 56, gridW = 836, gridH = 820;
  var cellW = gridW / cols;
  var cellH = gridH / rows;
  data.files.forEach(function (file, index) {
    var col = index % cols;
    var row = Math.floor(index / cols);
    fileAt[file] = {
      x: gridX + col * cellW + cellW / 2,
      y: gridY + row * cellH + cellH / 2
    };
  });

  var edgeLayer = document.getElementById("edges");
  data.edges.forEach(function (edge) {
    var from = featureAt[edge.feature];
    var to = fileAt[edge.file];
    var path = document.createElementNS(NS, "line");
    path.setAttribute("x1", from.x);
    path.setAttribute("y1", from.y);
    path.setAttribute("x2", to.x);
    path.setAttribute("y2", to.y);
    path.setAttribute("stroke", "var(--line)");
    path.setAttribute("stroke-width", "1");
    path.dataset.feature = edge.feature;
    path.dataset.file = edge.file;
    var tip = document.createElementNS(NS, "title");
    tip.textContent = edge.feature + " → " + edge.file + ": " + edge.reason;
    path.appendChild(tip);
    edgeLayer.appendChild(path);
  });

  var fileLayer = document.getElementById("files");
  data.files.forEach(function (file) {
    var at = fileAt[file];
    var dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", at.x);
    dot.setAttribute("cy", at.y);
    dot.setAttribute("r", "3.2");
    dot.setAttribute("fill", "var(--stroke)");
    dot.dataset.file = file;
    var tip = document.createElementNS(NS, "title");
    tip.textContent = file;
    dot.appendChild(tip);
    fileLayer.appendChild(dot);
  });

  var knotLayer = document.getElementById("knots");
  var callH = 148, callGap = 8, callX = 1096, callW = 328, callY0 = 56;
  data.knots.forEach(function (knot, index) {
    var at = fileAt[knot.file];
    var badge = document.createElementNS(NS, "g");
    badge.setAttribute("transform", "translate(" + at.x + " " + at.y + ")");
    badge.style.cursor = "pointer";
    badge.dataset.knot = String(knot.n);
    var ring = document.createElementNS(NS, "circle");
    ring.setAttribute("r", "9");
    ring.setAttribute("fill", "var(--alert)");
    var num = document.createElementNS(NS, "text");
    num.setAttribute("text-anchor", "middle");
    num.setAttribute("y", "4");
    num.setAttribute("fill", "#fff");
    num.setAttribute("font-family", "ui-monospace, SF Mono, Menlo, monospace");
    num.setAttribute("font-size", "12");
    num.textContent = String(knot.n);
    badge.appendChild(ring);
    badge.appendChild(num);
    badge.addEventListener("click", function () { select(knot.n); });
    knotLayer.appendChild(badge);

    var y = callY0 + index * (callH + callGap);
    var fo = document.createElementNS(NS, "foreignObject");
    fo.setAttribute("x", callX);
    fo.setAttribute("y", y);
    fo.setAttribute("width", callW);
    fo.setAttribute("height", callH);
    var div = document.createElement("div");
    div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    div.className = "callout";
    div.dataset.knot = String(knot.n);
    var head = document.createElement("div");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "knot-btn";
    btn.id = "knot-btn-" + knot.n;
    btn.dataset.knot = String(knot.n);
    btn.textContent = String(knot.n);
    btn.addEventListener("click", function () { select(knot.n); });
    var kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = knot.kind;
    head.appendChild(btn);
    head.appendChild(kind);
    var where = document.createElement("div");
    where.className = "where";
    where.textContent = knot.file + ":" + knot.line;
    var how = document.createElement("p");
    how.className = "how";
    how.textContent = knot.how;
    div.appendChild(head);
    div.appendChild(where);
    div.appendChild(how);
    fo.appendChild(div);
    knotLayer.appendChild(fo);
  });

  function select(n) {
    var knot = knotByN[n];
    document.querySelectorAll(".callout").forEach(function (el) {
      el.classList.toggle("is-on", el.dataset.knot === String(n));
    });
    document.querySelectorAll("#edges line").forEach(function (el) {
      var hot = el.dataset.file === knot.file;
      el.classList.toggle("is-hot", hot);
      el.setAttribute("stroke", hot ? "var(--alert)" : "var(--line)");
      el.setAttribute("stroke-width", hot ? "2.2" : "1");
    });
    board.dataset.emphasized = String(n);
  }
})();
</script>
