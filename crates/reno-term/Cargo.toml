[package]
name = "reno-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Imported code (ARCH-3): keeps its own lint table instead of `lints.workspace = true`.
#
# The terminal emulator core without a renderer: alacritty's `Term` + vte as a pure state
# machine, plus local echo prediction. A leaf crate: it names no workspace crate.
[dependencies]
alacritty_terminal.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
