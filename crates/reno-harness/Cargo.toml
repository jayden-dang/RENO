[package]
name = "reno-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Imported code keeps its own lint table during stage A: a member cannot combine
# `[lints] workspace = true` with overrides. Stage B switches the crate to the
# workspace table. Every allow below states why it is there.
[lints.rust]

[lints.clippy]
# Style lints that the imported code predates; rewriting working wire code to satisfy them risks
# behaviour changes, and stage B restructures these modules anyway.
collapsible_if = "allow" # nested `if`/`if let` chains kept as upstream wrote them
doc_lazy_continuation = "allow" # prose-style doc lists in the driver module headers
large_enum_variant = "allow" # `Frame` mirrors the CLI's wire shapes; boxing would change the parser
len_zero = "allow" # `.len() > 0` in the registry parser
manual_pattern_char_comparison = "allow" # a char-class closure in the redactor
type_complexity = "allow" # nested channel/future types in the driver loops

[dependencies]
async-trait.workspace = true
base64.workspace = true
bzip2.workspace = true
chrono.workspace = true
deser-hjson.workspace = true
filetime.workspace = true
flate2.workspace = true
futures.workspace = true
pulldown-cmark.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io-util", "codec"] }
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
