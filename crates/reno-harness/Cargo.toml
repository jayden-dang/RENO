[package]
name = "reno-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reno-proto.workspace = true
async-trait.workspace = true
bzip2.workspace = true
filetime.workspace = true
flate2.workspace = true
futures.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io-util", "codec"] }
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# The conformance suite (`reno_harness::conformance`): one set of checks, written against
# `dyn Executor`, that the mock, every driver's fake and (opt-in) the real CLIs run. Off in
# production builds; the harness's own tests turn it on through the dev-dependency below.
conformance = []

[dev-dependencies]
# Turns the `conformance` feature on for this crate's own integration tests, so the suite runs
# in plain `cargo test`.
reno-harness = { path = ".", features = ["conformance"] }
# Validates the Codex driver's wire traffic against the schema `codex app-server
# generate-json-schema` emits. Default features (HTTP and file `$ref` resolution, TLS) stay off:
# the schemas are self-contained.
jsonschema = { version = "0.54.0", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
