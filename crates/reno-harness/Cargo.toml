[package]
name = "reno-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reno-proto.workspace = true
async-trait.workspace = true
bzip2.workspace = true
filetime.workspace = true
flate2.workspace = true
futures.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
# preserve_order: a settings file edited in place keeps its key order.
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io-util", "codec"] }
# Reads the names in the owner's Codex `mcp_servers` table, to switch them off for a run.
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# The conformance suite (`reno_harness::conformance`): one set of checks, written against
# `dyn Executor`, that the mock, every driver's fake and (opt-in) the real CLIs run. Off in
# production builds; the harness's own tests turn it on through the dev-dependency below.
conformance = []

# The MCP server the live conformance run injects (`tests/conformance_live.rs`). Integration
# tests find it through `CARGO_BIN_EXE_conformance-ping-mcp`, so building the test builds it.
[[bin]]
name = "conformance-ping-mcp"
path = "tests/support/ping_mcp.rs"
required-features = ["conformance"]
test = false
doc = false

[dev-dependencies]
# Turns the `conformance` feature on for this crate's own integration tests, so the suite runs
# in plain `cargo test`.
reno-harness = { path = ".", features = ["conformance"] }
# Validates the Codex driver's wire traffic against the schema `codex app-server
# generate-json-schema` emits. Default features (HTTP and file `$ref` resolution, TLS) stay off:
# the schemas are self-contained.
jsonschema = { version = "0.54.0", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
