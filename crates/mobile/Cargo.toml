[package]
name = "reno-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "reno_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
reno-voice-session.workspace = true
reno-orb.workspace = true
reno-veil.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = "0.32"
reno-markdown.workspace = true
reno-text.workspace = true
reno-visual.workspace = true
reno-visual-gpu.workspace = true
reno-doc.workspace = true
reno-proto.workspace = true
reno-client.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
reno-syntax.workspace = true
zatex = { workspace = true, features = ["bundled"] }
thiserror.workspace = true
reno-term.workspace = true
