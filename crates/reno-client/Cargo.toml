[package]
name = "reno-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-process fake daemon (`reno_client::fake`) for tests and for developing the app without
# a real daemon. Off by default.
fake = []

[dependencies]
reno-proto.workspace = true
reno-rpc.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
futures.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "rt", "macros", "time"] }

[[test]]
name = "fake_daemon"
required-features = ["fake"]

[[test]]
name = "supervisor"
required-features = ["fake"]

[lints]
workspace = true
